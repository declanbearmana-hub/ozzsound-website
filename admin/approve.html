<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ozzsound Admin Device Approval</title><style>body{font-family:Arial,sans-serif;background:#080912;color:white;min-height:100vh;display:grid;place-items:center;margin:0}main{max-width:480px;margin:20px;padding:32px;background:#131321;border:1px solid #51416b;border-radius:16px;text-align:center}h1{color:#ca60ef}p{line-height:1.6}button{padding:15px 24px;background:#a943dd;color:white;border:0;border-radius:9px;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#8ad9ff}</style></head><body><main><h1>Ozzsound Admin</h1><p id="message">Confirm whether to approve this browser for Admin access.</p><button id="confirm" type="button">Confirm approval</button><p><a href="/admin/">Return to Admin</a></p></main><script>const params=new URLSearchParams(location.search),token=params.get("token"),decision=params.get("decision"),button=document.getElementById("confirm"),message=document.getElementById("message");history.replaceState(null,"",location.pathname);if(!token||!["allow","deny"].includes(decision)){button.hidden=true;message.textContent="Invalid approval link. Please request a new security email."}else{button.textContent=decision==="allow"?"Confirm approval":"Confirm denial";button.onclick=async()=>{button.disabled=true;message.textContent="Checking your request…";try{const response=await fetch("https://lnritqkwejumknddyfzu.supabase.co/functions/v1/admin-device-approval",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,decision})});const data=await response.json();if(response.ok&&data.status===(decision==="allow"?"approved":"denied")){message.textContent=decision==="allow"?"Device approved. Return to your original Admin tab.":"Login denied.";button.hidden=true}else{message.textContent=data.error||"Approval failed or link expired. Request a new security email.";button.hidden=true}}catch(e){message.textContent="Unable to contact the security server. Please try again.";button.disabled=false}}}</script></body></html>
