<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozzsound Admin</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #07070c;
      --panel: #101018;
      --panel2: #15151f;
      --panel3: #0b0b12;
      --border: rgba(255,255,255,0.09);
      --text: #ffffff;
      --muted: #9292a3;
      --purple: #a855f7;
      --pink: #ff38d1;
      --cyan: #22d3ee;
      --green: #35e6a5;
      --orange: #ffb454;
      --red: #ff647c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(174,0,255,0.15), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(0,225,255,0.10), transparent 32%),
        var(--bg);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 11px;
      border: 1px solid #30303e;
      outline: none;
      background: #0a0a12;
      color: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 105px;
      line-height: 1.5;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #d7d7df;
      font-size: 13px;
      font-weight: 700;
    }

    /* LOGIN */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      padding: 42px;
      border-radius: 24px;
      background: rgba(14,14,24,0.96);
      border: 1px solid var(--border);
      box-shadow:
        0 0 40px rgba(174,0,255,0.16),
        0 25px 80px rgba(0,0,0,0.45);
    }

    .brand-title {
      margin: 0;
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      background:
        linear-gradient(
          90deg,
          var(--pink),
          var(--purple),
          var(--cyan)
        );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      margin: 9px 0 30px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .primary-button {
      width: 100%;
      margin-top: 24px;
      padding: 15px 18px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      background:
        linear-gradient(
          90deg,
          #d629d7,
          #8b4dff,
          #00bfe8
        );
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 10px;
      font-size: 14px;
    }

    .message.error {
      display: block;
      color: #ff9aaa;
      background: rgba(255,70,100,0.10);
      border: 1px solid rgba(255,70,100,0.35);
    }

    /* ADMIN */

    #adminArea {
      display: none;
      min-height: 100vh;
    }

    .admin-header {
      min-height: 78px;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,7,12,0.92);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
    }

    .admin-logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      background:
        linear-gradient(
          90deg,
          var(--pink),
          var(--purple),
          var(--cyan)
        );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .admin-email {
      color: var(--muted);
      font-size: 13px;
    }

    .logout-button,
    .refresh-button,
    .secondary-button,
    .small-button {
      border-radius: 10px;
      border: 1px solid var(--border);
      color: #fff;
      background: var(--panel2);
      cursor: pointer;
      font-weight: 700;
    }

    .logout-button,
    .refresh-button {
      padding: 10px 17px;
    }

    .secondary-button {
      padding: 12px 16px;
    }

    .small-button {
      padding: 8px 11px;
      font-size: 12px;
    }

    .admin-content {
      width: 100%;
      max-width: 1500px;
      margin: auto;
      padding: 42px 30px 70px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 38px;
    }

    .page-heading p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 22px;
      border-radius: 17px;
      background: rgba(16,16,24,0.94);
      border: 1px solid var(--border);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-number {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 900;
    }

    /* CUSTOMER RESPONSE ALERTS */

    .admin-notification-area {
      display: none;
      margin-bottom: 26px;
    }

    .admin-notification-area.has-notifications {
      display: grid;
      gap: 12px;
    }

    .admin-notification {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 20px 22px;
      border-radius: 16px;
      background: #11151a;
      border: 2px solid rgba(53,230,165,.72);
      box-shadow:
        0 0 0 1px rgba(53,230,165,.10),
        0 0 34px rgba(53,230,165,.16);
    }

    .admin-notification.quote_accepted {
      animation:
        acceptedAlertPulse 1.8s ease-in-out 3;
    }

    .admin-notification.quote_changes {
      border-color: rgba(255,180,84,.72);
      box-shadow:
        0 0 0 1px rgba(255,180,84,.10),
        0 0 30px rgba(255,180,84,.12);
    }

    .admin-notification.quote_declined {
      border-color: rgba(255,100,124,.68);
      box-shadow:
        0 0 0 1px rgba(255,100,124,.10),
        0 0 30px rgba(255,100,124,.12);
    }

    @keyframes acceptedAlertPulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(53,230,165,.10),
          0 0 24px rgba(53,230,165,.12);
      }

      50% {
        box-shadow:
          0 0 0 3px rgba(53,230,165,.20),
          0 0 48px rgba(53,230,165,.30);
      }
    }

    .admin-notification-icon {
      font-size: 32px;
      line-height: 1;
    }

    .admin-notification-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .admin-notification-message {
      margin-top: 5px;
      color: #d8d8e2;
      line-height: 1.5;
    }

    .admin-notification-time {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .admin-notification-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .notification-open-button,
    .notification-seen-button {
      padding: 11px 14px;
      border-radius: 10px;
      font-weight: 900;
    }

    .notification-open-button {
      border: 0;
      color: #07100d;
      background: var(--green);
    }

    .notification-seen-button {
      color: #d8d8e2;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
    }

    /* TOOLBAR */

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 14px;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    /* ENQUIRIES */

    .enquiry-list {
      display: grid;
      gap: 13px;
    }

    .enquiry-card {
      display: grid;
      grid-template-columns:
        1.4fr
        1fr
        1fr
        1fr
        150px;
      align-items: center;
      gap: 20px;
      padding: 20px 22px;
      border-radius: 16px;
      background: rgba(16,16,24,0.95);
      border: 1px solid var(--border);
      transition:
        border-color .2s ease,
        transform .2s ease;
    }

    .enquiry-card:hover {
      transform: translateY(-1px);
      border-color: rgba(168,85,247,0.45);
    }

    .client-name {
      font-size: 17px;
      font-weight: 800;
    }

    .reference {
      margin-top: 5px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 700;
    }

    .field-label {
      margin-bottom: 5px;
      color: #717181;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .field-value {
      color: #e5e5ed;
      font-size: 14px;
    }

    .photos {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .status-new {
      color: #7debd0;
      background: rgba(53,230,165,.12);
      border: 1px solid rgba(53,230,165,.25);
    }

    .status-reviewing,
    .status-contacted {
      color: #7fdcff;
      background: rgba(34,211,238,.12);
      border: 1px solid rgba(34,211,238,.25);
    }

    .status-quoted {
      color: #d2a3ff;
      background: rgba(168,85,247,.12);
      border: 1px solid rgba(168,85,247,.25);
    }

    .status-booked {
      color: #ff9ee8;
      background: rgba(255,56,209,.12);
      border: 1px solid rgba(255,56,209,.25);
    }

    .status-completed {
      color: #b8b8c5;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
    }

    .status-declined,
    .status-cancelled {
      color: #ff9aaa;
      background: rgba(255,100,124,.10);
      border: 1px solid rgba(255,100,124,.25);
    }

    .open-button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid rgba(168,85,247,.35);
      background: rgba(168,85,247,.10);
      color: #d9b6ff;
      cursor: pointer;
      font-weight: 800;
    }

    .loading,
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .error-state {
      padding: 22px;
      border-radius: 14px;
      color: #ff9aaa;
      background: rgba(255,70,100,.08);
      border: 1px solid rgba(255,70,100,.25);
    }

    /* MODAL */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 30px 20px;
      overflow-y: auto;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);
    }

    .modal {
      width: 100%;
      max-width: 1120px;
      margin: auto;
      border-radius: 22px;
      overflow: hidden;
      background: #101018;
      border: 1px solid var(--border);
      box-shadow:
        0 30px 100px rgba(0,0,0,.65);
    }

    .modal-header {
      padding: 24px 26px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: -30px;
      z-index: 5;
      background: rgba(16,16,24,.97);
      backdrop-filter: blur(12px);
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-button {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1b1b26;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    .modal-body {
      padding: 26px;
    }

    .workflow-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          rgba(168,85,247,.12),
          rgba(34,211,238,.06)
        );
      border: 1px solid rgba(168,85,247,.25);
    }

    .workflow-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-button {
      padding: 11px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    .action-review {
      background: rgba(34,211,238,.12);
      border-color: rgba(34,211,238,.28);
      color: #9aeaff;
    }

    .action-decline {
      background: rgba(255,100,124,.10);
      border-color: rgba(255,100,124,.28);
      color: #ff9aaa;
    }

    .action-save {
      background:
        linear-gradient(
          135deg,
          #8b4dff,
          #d629d7
        );
      border: 0;
    }

    .action-ready {
      background: rgba(168,85,247,.13);
      border-color: rgba(168,85,247,.4);
      color: #e0c1ff;
    }

    .action-send {
      background: linear-gradient(135deg,#00a9d6,#8b4dff);
      border: 0;
      color: #fff;
    }

    .detail-grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 18px;
    }

    .detail-box {
      padding: 16px;
      border-radius: 12px;
      background: var(--panel3);
      border: 1px solid var(--border);
    }

    .detail-box.full {
      grid-column: 1 / -1;
    }

    .detail-title {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .detail-text {
      color: #eeeef4;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .section-card {
      grid-column: 1 / -1;
      padding: 20px;
      border-radius: 16px;
      background: #0b0b12;
      border: 1px solid var(--border);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .section-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .quote-status {
      padding: 7px 10px;
      border-radius: 999px;
      color: #d9b6ff;
      background: rgba(168,85,247,.1);
      border: 1px solid rgba(168,85,247,.25);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .quote-add-grid {
      display: grid;
      grid-template-columns:
        1.6fr
        100px
        140px
        auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 16px;
    }

    .quote-add-grid label {
      margin-top: 0;
    }

    .quote-items {
      display: grid;
      gap: 10px;
    }

    .quote-item {
      display: grid;
      grid-template-columns:
        1.6fr
        90px
        130px
        130px
        90px;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
    }

    .quote-item-name strong {
      display: block;
    }

    .quote-item-name small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    .money {
      font-weight: 800;
      text-align: right;
    }

    .remove-button {
      padding: 9px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255,100,124,.25);
      background: rgba(255,100,124,.08);
      color: #ff9aaa;
      cursor: pointer;
      font-weight: 800;
    }

    .quote-summary {
      margin-top: 16px;
      margin-left: auto;
      width: 100%;
      max-width: 420px;
      display: grid;
      gap: 9px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #d8d8e2;
    }

    .summary-row.total {
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 20px;
      font-weight: 900;
      color: #fff;
    }

    .two-col {
      display: grid;
      grid-template-columns:
        1fr
        1fr;
      gap: 14px;
    }

    .info-banner {
      padding: 13px 15px;
      margin: 14px 0;
      border-radius: 11px;
      color: #b8b8c5;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.55;
    }

    .call-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 15px;
      margin-top: 14px;
      border-radius: 11px;
      background: rgba(34,211,238,.07);
      border: 1px solid rgba(34,211,238,.2);
      color: #c8f5ff;
      font-size: 13px;
      font-weight: 700;
    }

    .notes-list {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .note-row {
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
    }

    .note-meta {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .note-body {
      color: #e9e9ef;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .photo-toolbar {
      margin: 14px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .photo-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(180px,1fr)
        );
      gap: 14px;
    }

    .photo-select-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 7px 10px;
      border-radius: 9px;
      background: rgba(255,255,255,.05);
      color: #d8d8e2;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .photo-select-label input {
      width: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--purple);
      cursor: pointer;
    }

    .photo-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .photo-link {
      display: block;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #08080e;
      color: #fff;
      text-decoration: none;
    }

    .photo-link img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #08080e;
    }

    .photo-name {
      padding: 10px 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #b8b8c5;
    }

    .file-link {
      display: flex;
      min-height: 120px;
      padding: 18px;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 14px;
      border: 1px solid rgba(168,85,247,.3);
      background: rgba(168,85,247,.08);
      color: #d9b6ff;
      text-decoration: none;
      font-weight: 700;
      word-break: break-word;
    }

    .booking-box {
      padding: 15px;
      border-radius: 12px;
      background: rgba(53,230,165,.07);
      border: 1px solid rgba(53,230,165,.22);
      color: #b9f7e5;
      line-height: 1.55;
    }

    @media (max-width: 1050px) {
      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .enquiry-card {
        grid-template-columns:
          1fr
          1fr;
      }

      .quote-item {
        grid-template-columns:
          1fr
          90px
          120px;
      }
    }

    @media (max-width: 760px) {
      .admin-header {
        padding: 15px 18px;
      }

      .admin-email {
        display: none;
      }

      .admin-content {
        padding: 30px 16px 60px;
      }

      .page-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns:
          1fr
          1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .enquiry-card {
        grid-template-columns: 1fr;
      }

      .detail-grid,
      .two-col {

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function displayValue(value) {

      if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
      ) {
        return "Not supplied";
      }

      return escapeHtml(value);
    }


    function formatDate(value) {

      if (!value) {
        return "Not supplied";
      }

      const parts =
        String(value).split("-");

      if (parts.length === 3) {

        return (
          `${parts[2]}/${parts[1]}/${parts[0]}`
        );
      }

      return escapeHtml(value);
    }


    function formatDateTime(value) {

      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return escapeHtml(value);
      }

      return date.toLocaleString(
        "en-AU",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    function money(value) {

      return new Intl.NumberFormat(
        "en-AU",
        {
          style: "currency",
          currency: "AUD"
        }
      ).format(
        Number(value || 0)
      );
    }


    function normaliseStatus(value) {

      const status =
        String(
          value || "new"
        ).toLowerCase();


      if (
        status === "contacted"
      ) {
        return "reviewing";
      }


      const allowed = [
        "new",
        "reviewing",
        "quoted",
        "booked",
        "completed",
        "declined",
        "cancelled"
      ];


      return allowed.includes(status)
        ? status
        : "new";
    }


    function statusLabel(value) {

      const status =
        normaliseStatus(value);


      const labels = {
        new: "New",
        reviewing: "Reviewing",
        quoted: "Quote Ready",
        booked: "Booked",
        completed: "Completed",
        declined: "Declined",
        cancelled: "Cancelled"
      };


      return (
        labels[status] ||
        "New"
      );
    }


    function pathArray(value) {

      if (!value) {
        return [];
      }


      if (
        Array.isArray(value)
      ) {

        return value.filter(
          item =>
            typeof item === "string"
        );
      }


      if (
        typeof value === "string"
      ) {

        try {

          const parsed =
            JSON.parse(value);


          if (
            Array.isArray(parsed)
          ) {

            return parsed.filter(
              item =>
                typeof item === "string"
            );
          }

        } catch (_) {}


        return [value];
      }


      return [];
    }


    function safeFileName(name) {

      return String(

        "Ozzsound-file"
      )
        .replace(
          /[<>:"/\\|?*\x00-\x1F]/g,
          "_"
        )
        .replace(
          /[. ]+$/g,
          ""
        )
        .slice(
          0,
          180
        ) ||
        "Ozzsound-file";

    async function verifyAdmin(
      user
    ) {

      if (!user) {

        showLogin();

        return false;
      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "is_admin"
        );


      if (
        error ||
        data !== true
      ) {

        await supabaseClient
          .auth
          .signOut();


        showLogin();


        showMessage(
          "Access denied. This account is not an authorised Ozzsound administrator.",
          "error"
        );


        return false;
      }


      currentUserId =
        user.id;


      showAdmin(
        user.email
      );


      await loadEnquiries();


      startAdminNotificationRealtime();


      return true;
    }

            .order(

          supabaseClient

            )
            .order(
              "name",

          supabaseClient

        ]);


      refreshButton.disabled =
        false;


      if (

          enquiryResult.error
        );


        enquiryList.innerHTML =
          '<div class="error-state">Could not load enquiries. Please refresh and try again.</div>';

      if (

        console.error(

          inventoryResult.error

      } else {

        inventory =
          inventoryResult.data || [];
      }


      allEnquiries =

      if (
        notificationResult.error

        console.error(
          "Could not load admin notifications:",

        adminNotifications = [];

      } else {

        adminNotifications =

      renderAdminNotifications();

      updateStats();

      filterEnquiries();


      /*

        If the administrator arrived from:

        automatically open that enquiry.

      if (
        requestedEnquiryId &&

        deepLinkOpened =

    async function dismissAdminNotification(
      notificationId
    ) {

      const {
        error
      } =
        await supabaseClient
          .from(
            "admin_notifications"
          )
          .update({
            read_at:
              new Date()
                .toISOString()
          })
          .eq(
            "id",
            notificationId
          );


      if (error) {

        console.error(
          "Could not mark notification as seen:",
          error
        );

        return;
      }


      adminNotifications =
        adminNotifications.filter(
          notification =>
            String(
              notification.id
            ) !==
            String(
              notificationId
            )
        );


      renderAdminNotifications();
    }

      notificationId,
      enquiryId
    ) {

      await dismissAdminNotification(
        notificationId
      );


      await openEnquiry(

      );
    }


    function startAdminNotificationRealtime() {

      if (
        notificationChannel
      ) {

        supabaseClient
          .removeChannel(
            notificationChannel
          );
      }


      notificationChannel =
        supabaseClient
          .channel(
            "ozzsound-admin-notifications"
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "admin_notifications"
            },
            payload => {

              const notification =
                payload.new;


              if (
                !notification ||
                adminNotifications.some(
                  item =>
                    String(item.id) ===
                    String(
                      notification.id
                    )
                )
              ) {
                return;
              }


              adminNotifications =
                [
                  notification,
                  ...adminNotifications
                ];


              renderAdminNotifications();


              if (
                notification
                  .notification_type ===
                  "quote_accepted"
              ) {

                window.alert(
                  "🚨 CUSTOMER ACCEPTED A QUOTE\n\n" +
                  (
                    notification.message ||
                    "Open Ozzsound Admin for details."
                  )
                );
              }
            }
          )
          .subscribe();
    }

    function filterEnquiries() {

      const search =
        searchInput
          .value
          .trim()
          .toLowerCase();


      const selectedStatus =
        statusFilter.value;


      const filtered =
        allEnquiries.filter(
          enquiry => {

            const status =
              normaliseStatus(
                enquiry.status
              );


            const searchableText = [
              enquiry.name,
              enquiry.enquiry_ref,
              enquiry.event_type,
              enquiry.enquiry_type,
              enquiry.venue_suburb,
              enquiry.email,
              enquiry.phone
            ]
              .join(" ")
              .toLowerCase();


            const matchesSearch =
              !search ||
              searchableText.includes(
                search
              );


            const matchesStatus =
              selectedStatus === "all" ||
              status === selectedStatus;


            return (
              matchesSearch &&
              matchesStatus
            );
          }
        );


      renderEnquiries(
        filtered
      );
    }

          supabaseClient

              "bookings"

              "id,enquiry_id,quote_id,event_date,booking_type,status,confirmed_at,created_at"
            )

              "enquiry_id",

            )

        quoteResult.error

          "Quote load error:",
          quoteResult.error
        );

      if (
        notesResult.error
      ) {

        console.error(
          "Notes load error:",
          notesResult.error
        );
      }


      if (
        bookingResult.error
      ) {

        console.error(
          "Booking load error:",
          bookingResult.error
        );
      }

        quoteResult.data?.[0] ||
        null;

      currentBooking =
        bookingResult.data?.[0] ||
        null;

        } =

            )

              }

    function venuePathsFor(
      enquiry
    ) {

      const directVenue =
        pathArray(
          enquiry.attachment_paths
        );


      if (
        directVenue.length
      ) {

        return [
          ...new Set(
            directVenue
          )
        ];
      }


      /*
        Legacy fallback:
        if attachment_paths is empty,
        use upload_paths but remove
        known wedding-display photos.
      */

      const allUploads =
        pathArray(
          enquiry.upload_paths
        );


      const display =
        new Set(
          pathArray(
            enquiry.display_photo_paths
          )
        );


      return [
        ...new Set(
          allUploads.filter(
            path =>
              !display.has(path)
          )
        )
      ];
    }


    function displayPhotoPathsFor(
      enquiry
    ) {

      return [
        ...new Set(
          pathArray(
            enquiry.display_photo_paths
          )
        )
      ];
    }

          groups[category].push(

    function quoteSubtotal() {

      return currentQuoteItems
        .reduce(
          (
            sum,
            item
          ) => {

            return (
              sum +
              (
                Number(
                  item.quantity || 0
                ) *
                Number(
                  item.unit_price || 0
                )
              )
            );
          },
          0
        );
    }


    function quoteAdjustment() {

      const field =
        document.getElementById(
          "quoteAdjustment"
        );


      return Number(
        field?.value || 0
      );
    }


    function roundCurrency(
      value
    ) {

      return Math.round(
        (
          Number(value || 0) +
          Number.EPSILON
        ) *
        100
      ) / 100;
    }


    function updateQuoteTotals() {

      const subtotal =
        quoteSubtotal();


      const adjustment =
        quoteAdjustment();


      const gstExclusiveTotal =
        Math.max(
          0,
          subtotal + adjustment
        );


      const gstAmount =
        roundCurrency(
          gstExclusiveTotal *
          AUSTRALIAN_GST_RATE
        );


      const total =
        roundCurrency(
          gstExclusiveTotal +
          gstAmount
        );


      const subtotalEl =
        document.getElementById(
          "quoteSubtotal"
        );


      const adjustmentEl =
        document.getElementById(
          "quoteAdjustmentDisplay"
        );


      const gstEl =
        document.getElementById(
          "quoteGst"
        );


      const totalEl =
        document.getElementById(
          "quoteTotal"
        );


      if (subtotalEl) {

        subtotalEl.textContent =
          money(subtotal);
      }


      if (adjustmentEl) {

        adjustmentEl.textContent =
          money(adjustment);
      }


      if (gstEl) {

        gstEl.textContent =
          money(gstAmount);
      }


      if (totalEl) {

        totalEl.textContent =
          money(total);
      }
    }


    window.updateQuoteItem =
      function(
        index,
        field,
        value
      ) {

        if (
          !currentQuoteItems[
            index
          ]
        ) {
          return;
        }


        if (
          field === "quantity"
        ) {

          currentQuoteItems[
            index
          ].quantity =
            Math.max(
              1,
              parseInt(
                value || "1",
                10
              )
            );
        }


        if (
          field === "unit_price"
        ) {

          currentQuoteItems[
            index
          ].unit_price =
            Math.max(
              0,
              Number(
                value || 0
              )
            );
        }


        renderQuoteItems();
      };


    window.removeQuoteItem =
      function(index) {

        currentQuoteItems.splice(
          index,
          1
        );


        renderQuoteItems();
      };

        return false;
      }


      const {
        error
      } =
        await supabaseClient
          .from(
            "enquiries"
          )
          .update({
            status
          })
          .eq(
            "id",
            currentEnquiry.id
          );


      if (error) {

        console.error(
          error
        );


        alert(
          "The enquiry status could not be updated."
        );


        return false;

            String(item.id) ===
            String(
              currentEnquiry.id
            )
        );


      if (listItem) {

        listItem.status =
          status;
      }


      updateStats();

      filterEnquiries();


      return true;
    }

    async function saveQuoteDraft(
      showSuccess = true
    ) {

      if (
        !currentEnquiry
      ) {
        return false;
      }


      const saveButton =
        document.getElementById(
          "saveQuoteButton"
        );


      if (saveButton) {

        saveButton.disabled =
          true;

        saveButton.textContent =
          "Saving...";
      }


      const subtotal =
        quoteSubtotal();


      const adjustment =
        quoteAdjustment();


      const gstExclusiveTotal =
        Math.max(
          0,
          subtotal + adjustment
        );


      const gstRate =
        AUSTRALIAN_GST_RATE;


      const gstAmount =
        roundCurrency(
          gstExclusiveTotal *
          gstRate
        );


      const total =
        roundCurrency(
          gstExclusiveTotal +
          gstAmount
        );


      const customerComments =
        document.getElementById(
          "customerQuoteComments"
        )?.value.trim() ||
        null;


      const privateNotes =
        document.getElementById(
          "privateQuoteNotes"
        )?.value.trim() ||
        null;


      try {

        /*
          CREATE QUOTE IF IT
          DOESN'T EXIST YET
        */

        if (
          !currentQuote
        ) {

          const {
            data,
            error
          } =
            await supabaseClient
              .from(
                "quotes"
              )
              .insert({

                enquiry_id:
                  currentEnquiry.id,

                version:
                  1,

                status:
                  "draft",

                subtotal,

                adjustment,

                gst_rate:
                  gstRate,

                gst_amount:
                  gstAmount,

                total,

                customer_visible_comments:
                  customerComments,

                private_admin_notes:
                  privateNotes,

                call_requested:
                  false,

                created_by:
                  currentUserId

              })
              .select()
              .single();


          if (error) {
            throw error;
          }


          currentQuote =
            data;

        } else {

          /*
            UPDATE EXISTING QUOTE
          */

          const {
            data,
            error
          } =
            await supabaseClient
              .from(
                "quotes"
              )
              .update({

                subtotal,

                adjustment,

                gst_rate:
                  gstRate,

                gst_amount:
                  gstAmount,

                total,

                customer_visible_comments:
                  customerComments,

                private_admin_notes:
                  privateNotes

              })
              .eq(
                "id",
                currentQuote.id
              )
              .select()
              .single();


          if (error) {
            throw error;
          }


          currentQuote =
            data;
        }


        /*
          REBUILD QUOTE ITEMS
        */

        const {
          error: deleteError
        } =
          await supabaseClient
            .from(
              "quote_items"
            )
            .delete()
            .eq(
              "quote_id",
              currentQuote.id
            );


        if (
          deleteError
        ) {
          throw deleteError;
        }


        if (
          currentQuoteItems.length
        ) {

          const rows =
            currentQuoteItems.map(
              (
                item,
                index
              ) => ({

                quote_id:
                  currentQuote.id,

                inventory_id:
                  item.inventory_id ||
                  null,

                item_name:
                  item.item_name,

                item_type:
                  item.item_type ||
                  "equipment",

                quantity:
                  Math.max(
                    1,
                    Number(
                      item.quantity || 1
                    )
                  ),

                unit_price:
                  Math.max(
                    0,
                    Number(
                      item.unit_price || 0
                    )
                  ),

                source:
                  item.source === "customer"
                    ? "customer"
                    : "admin",

                is_suggestion:
                  Boolean(
                    item.is_suggestion
                  ),

                notes:
                  item.notes ||
                  null,

                sort_order:
                  index

              })
            );


          const {
            data,
            error
          } =
            await supabaseClient
              .from(
                "quote_items"
              )
              .insert(
                rows
              )
              .select(
                "id,inventory_id,item_name,item_type,quantity,unit_price,line_total,source,is_suggestion,notes,sort_order"
              );


          if (error) {
            throw error;
          }


          currentQuoteItems =
            data || [];
        }


        /*
          FIRST SAVE MOVES A NEW
          ENQUIRY INTO REVIEWING
        */

        if (
          normaliseStatus(
            currentEnquiry.status
          ) === "new"
        ) {

          await updateEnquiryStatus(
            "reviewing"
          );
        }


        if (
          showSuccess
        ) {

          alert(
            "Quote draft saved."
          );
        }


        return true;


      } catch (error) {

        console.error(
          "Quote save failed:",
          error
        );


        alert(
          "The quote could not be saved. Please try again."
        );


        return false;


      } finally {

        if (saveButton) {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "Save Draft Quote";
        }
      }
    }


    async function markQuoteReady() {

      const saved =
        await saveQuoteDraft(
          false
        );


      if (!saved) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from(
            "enquiries"
          )
          .update({
            status:
              "quoted"
          })
          .eq(
            "id",
            currentEnquiry.id
          );


      if (error) {

        console.error(
          error
        );


        alert(
          "The quote was saved, but the enquiry could not be marked Quote Ready."
        );


        return;
      }


      currentEnquiry.status =
        "quoted";


      const listItem =
        allEnquiries.find(
          item =>
            String(item.id) ===
            String(
              currentEnquiry.id
            )
        );


      if (listItem) {

        listItem.status =
          "quoted";
      }


      updateStats();

      filterEnquiries();


      alert(
        "Quote saved and marked Quote Ready. It has NOT been emailed to the customer yet — we will connect that customer quote email next."
      );


      renderModalContent();

      await renderUploadSections();
    }


    async function sendQuoteToCustomer() {

      if (!currentEnquiry) {
        return;
      }

      const saved =
        await saveQuoteDraft(false);

      if (!saved || !currentQuote) {
        return;
      }

      if (!currentEnquiry.email) {
        alert("This enquiry does not have a customer email address.");
        return;
      }

      if (!currentQuoteItems.length) {
        const proceed =
          confirm(
            "This quote has no individual items. Send it to the customer anyway?"
          );

        if (!proceed) {
          return;
        }
      }

      const confirmed =
        confirm(
          "Send this quote to " +
          currentEnquiry.email +
          "?\n\nThe customer will receive the quote, a secure access code and a link to their Ozzsound event portal."
        );

      if (!confirmed) {
        return;
      }

      const button =
        document.getElementById(
          "sendQuoteButton"
        );

      if (button) {
        button.disabled = true;
        button.textContent =
          "Sending Quote...";
      }

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .functions
            .invoke(
              "send-quote-email",
              {
                body: {
                  quote_id:
                    currentQuote.id
                }
              }
            );

        if (error) {
          throw error;
        }

        if (data?.success !== true) {
          throw new Error(
            data?.error ||
            "Quote email failed."
          );
        }

        currentQuote.status =
          "sent";

        currentQuote.sent_at =
          data.sent_at ||
          new Date().toISOString();

        currentEnquiry.status =
          "quoted";

        const listItem =
          allEnquiries.find(
            item =>
              String(item.id) ===
              String(currentEnquiry.id)
          );

        if (listItem) {
          listItem.status =
            "quoted";
        }

        updateStats();
        filterEnquiries();

        alert(
          "Quote sent to the customer successfully."
        );

        renderModalContent();
        await renderUploadSections();

      } catch (error) {

        console.error(
          "Quote email failed:",
          error
        );

        let errorMessage =
          error?.message ||
          "Unknown email error.";

        try {

          if (
            error?.context &&
            typeof error.context.clone ===
              "function"
          ) {

            const responseBody =
              await error.context
                .clone()
                .json();

            if (
              responseBody?.error
            ) {

              errorMessage =
                typeof responseBody.error ===
                  "string"
                  ? responseBody.error
                  : JSON.stringify(
                      responseBody.error
                    );
            }
          }

        } catch (_) {}


        alert(
          "The quote could not be emailed. " +
          "The saved quote has not been lost.\n\n" +
          "Error: " +
          errorMessage
        );

      } finally {

        if (button) {
          button.disabled = false;
          button.textContent =
            "Send Quote to Customer";
        }
      }
    }


    async function addEnquiryNote() {

      if (
        !currentEnquiry
      ) {
        return;
      }


      const type =
        document.getElementById(
          "newNoteType"
        )?.value ||
        "private";


      const body =
        document.getElementById(
          "newNoteBody"
        )?.value.trim() ||
        "";


      if (!body) {

        alert(
          "Write a note first."
        );

        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "enquiry_notes"
          )
          .insert({

            enquiry_id:
              currentEnquiry.id,

            note_type:
              type,

            body,

            created_by:
              currentUserId

          })
          .select(
            "id,note_type,body,created_at"
          )
          .single();


      if (error) {

        console.error(
          error
        );


        alert(
          "The note could not be saved."
        );


        return;
      }


      currentNotes.unshift(
        data
      );


      renderNotes();


      document.getElementById(
        "newNoteBody"
      ).value =
        "";
    }


    function renderNotes() {

      const list =
        document.getElementById(
          "notesList"
        );


      if (!list) {
        return;
      }


      if (
        !currentNotes.length
      ) {

        list.innerHTML = `
          <div class="info-banner">
            No notes have been added to this enquiry yet.
          </div>
        `;

        return;
      }


      list.innerHTML =
        currentNotes.map(
          note => `

            <div class="note-row">

              <div class="note-meta">

                ${escapeHtml(
                  note.note_type === "customer"
                    ? "Customer-visible note"
                    : "Private admin note"
                )}

                ·

                ${escapeHtml(
                  formatDateTime(
                    note.created_at
                  )
                )}

              </div>

              <div class="note-body">
                ${escapeHtml(
                  note.body
                )}
              </div>

            </div>

          `
        )

    async function renderSecureGallery(
      galleryId,
      controlsId,
      paths,
      enquiry,
      enableExport
    ) {

      const gallery =
        document.getElementById(
          galleryId
        );


      if (
        !gallery ||
        !paths.length
      ) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from(
            "event-uploads"
          )
          .createSignedUrls(
            paths,
            3600
          );


      if (error) {

        console.error(
          "Could not create signed upload URLs:",
          error
        );


        gallery.innerHTML = `
          <div
            style="
              color:#ff9aaa;
            "
          >
            The uploaded files could not be loaded.
          </div>
        `;


        return;
      }


      const files =
        (data || []).filter(
          file =>
            file &&
            file.signedUrl
        );


      if (
        !files.length
      ) {

        gallery.innerHTML = `
          <div
            style="
              color:#9292a3;
            "
          >
            No viewable uploads were found.
          </div>
        `;


        return;
      }


      gallery.innerHTML =
        files.map(
          file => {

            const path =
              file.path ||
              "";


            const fileName =
              path
                .split("/")
                .pop() ||
              "Customer upload";


            const extension =
              fileName
                .split(".")
                .pop()
                .toLowerCase();


            const browserImage =
              [
                "jpg",
                "jpeg",
                "png",
                "webp",
                "gif"
              ].includes(
                extension
              );


            return `

              <div class="photo-card">

                ${
                  enableExport
                    ? `

                      <label class="photo-select-label">

                        <input
                          type="checkbox"
                          class="upload-select"
                          data-url="${escapeHtml(
                            file.signedUrl
                          )}"
                          data-name="${escapeHtml(
                            fileName
                          )}"
                        >

                        Select

                      </label>

                    `
                    : ""
                }


                ${
                  browserImage
                    ? `

                      <a
                        class="photo-link"
                        href="${escapeHtml(
                          file.signedUrl
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >

                        <img
                          src="${escapeHtml(
                            file.signedUrl
                          )}"
                          alt="Customer upload"
                          loading="lazy"
                        >

                        <div class="photo-name">
                          ${escapeHtml(
                            fileName
                          )}
                        </div>

                      </a>

                    `
                    : `

                      <a
                        class="file-link"
                        href="${escapeHtml(
                          file.signedUrl
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        Open
                        ${escapeHtml(
                          fileName
                        )}
                      </a>

                    `
                }

              </div>

            `;
          }
        )
        .join("");


      if (
        enableExport &&
        controlsId
      ) {

        setupExportControls(
          controlsId,
          gallery,
          enquiry
        );
      }
    }


    function setupExportControls(
      controlsId,
      gallery,
      enquiry
    ) {

      const controls =
        document.getElementById(
          controlsId
        );


      if (!controls) {
        return;
      }


      controls.innerHTML = `

        <div class="photo-toolbar">

          <label class="photo-select-label">

            <input
              type="checkbox"
              class="select-all-uploads"
            >

            Select All

          </label>


          <button
            type="button"
            class="
              action-button
              action-save
              download-selected
            "
          >
            Download Selected
          </button>


          <button
            type="button"
            class="
              action-button
              action-ready
              save-selected
            "
          >
            Save to Folder / USB
          </button>


          <span
            class="selected-upload-count"
            style="
              color:#9292a3;
              font-size:13px;
            "
          >
            0 selected
          </span>

        </div>
      `;


      const selectAll =
        controls.querySelector(
          ".select-all-uploads"
        );


      const downloadButton =
        controls.querySelector(
          ".download-selected"
        );


      const saveButton =
        controls.querySelector(
          ".save-selected"
        );


      const countLabel =
        controls.querySelector(
          ".selected-upload-count"
        );


      const getBoxes =
        () => [
          ...gallery.querySelectorAll(
            ".upload-select"
          )
        ];


      const getSelected =
        () =>
          getBoxes()
            .filter(
              box =>
                box.checked
            )
            .map(
              box => ({

                url:
                  box.dataset.url,

                name:
                  box.dataset.name ||
                  "Ozzsound-file"

              })
            );


      const updateCount =
        () => {

          const boxes =
            getBoxes();


          const selected =
            boxes.filter(
              box =>
                box.checked
            );


          countLabel.textContent =
            `${selected.length} selected`;


          selectAll.checked =
            boxes.length > 0 &&
            selected.length ===
              boxes.length;


          selectAll.indeterminate =
            selected.length > 0 &&
            selected.length <
              boxes.length;
        };


      selectAll.addEventListener(
        "change",
        () => {

          getBoxes().forEach(
            box => {

              box.checked =
                selectAll.checked;
            }
          );


          updateCount();
        }
      );


      gallery.addEventListener(
        "change",
        event => {

          if (
            event.target
              .classList
              .contains(
                "upload-select"
              )
          ) {

            updateCount();
          }
        }
      );


      /*
        DOWNLOAD SELECTED
      */

      downloadButton.addEventListener(
        "click",
        async () => {

          const selected =
            getSelected();


          if (
            !selected.length
          ) {

            alert(
              "Please select at least one venue file."
            );

            return;
          }


          const originalText =
            downloadButton.textContent;


          downloadButton.disabled =
            true;


          downloadButton.textContent =
            "Downloading...";


          try {

            for (
              let index = 0;
              index < selected.length;
              index++
            ) {

              const item =
                selected[index];


              const response =
                await fetch(
                  item.url
                );


              if (
                !response.ok
              ) {

                throw new Error(
                  `Could not download ${item.name}`
                );
              }


              const blob =
                await response.blob();


              const blobUrl =
                URL.createObjectURL(
                  blob
                );


              const link =
                document.createElement(
                  "a"
                );


              link.href =
                blobUrl;


              link.download =
                safeFileName(
                  item.name
                );


              document.body
                .appendChild(
                  link
                );


              link.click();

              link.remove();


              setTimeout(
                () =>
                  URL.revokeObjectURL(
                    blobUrl
                  ),
                2000
              );


              await new Promise(
                resolve =>
                  setTimeout(
                    resolve,
                    250
                  )
              );
            }


          } catch (error) {

            console.error(
              "Download failed:",
              error
            );


            alert(
              "One or more files could not be downloaded."
            );


          } finally {

            downloadButton.disabled =
              false;


            downloadButton.textContent =
              originalText;
          }
        }
      );


      /*
        SAVE TO FOLDER / USB
      */

      saveButton.addEventListener(
        "click",
        async () => {

          const selected =
            getSelected();


          if (
            !selected.length
          ) {

            alert(
              "Please select at least one venue file."
            );

            return;
          }


          if (
            !window.showDirectoryPicker
          ) {

            alert(
              "Saving directly to a folder is not supported by this browser. Please use Download Selected instead."
            );

            return;
          }


          const originalText =
            saveButton.textContent;


          try {

            saveButton.disabled =
              true;


            saveButton.textContent =
              "Choose Folder / USB...";


            const chosenDirectory =
              await window
                .showDirectoryPicker({
                  mode:
                    "readwrite"
                });


            const reference =
              safeFileName(
                enquiry.enquiry_ref ||
                "Ozzsound-Enquiry"
              );


            const clientName =
              safeFileName(
                enquiry.name ||
                "Client"
              );


            const exportFolderName =
              `Ozzsound - ${clientName} - ${reference}`;


            const exportDirectory =
              await chosenDirectory
                .getDirectoryHandle(
                  exportFolderName,
                  {
                    create: true
                  }
                );


            saveButton.textContent =
              "Saving Files...";


            for (
              let index = 0;
              index < selected.length;
              index++
            ) {

              const item =
                selected[index];


              const response =
                await fetch(
                  item.url
                );


              if (
                !response.ok
              ) {

                throw new Error(
                  `Could not retrieve ${item.name}`
                );
              }


              const blob =
                await response.blob();


              const originalName =
                String(
                  item.name || ""
                );


              const lastDot =
                originalName
                  .lastIndexOf(".");


              const extension =
                lastDot > -1
                  ? originalName.slice(
                      lastDot
                    )
                  : "";


              const extensionLower =
                extension
                  .toLowerCase();


              const isImage =
                [
                  ".jpg",
                  ".jpeg",
                  ".png",
                  ".webp",
                  ".gif",
                  ".heic",
                  ".heif"
                ].includes(
                  extensionLower
                );


              const fileNumber =
                String(
                  index + 1
                ).padStart(
                  2,
                  "0"
                );


              const fileType =
                isImage
                  ? "Photo"
                  : "File";


              const exportFileName =
                `${clientName} - ${fileType} ${fileNumber}${extension}`;


              const fileHandle =
                await exportDirectory
                  .getFileHandle(
                    safeFileName(
                      exportFileName
                    ),
                    {
                      create: true
                    }
                  );


              const writable =
                await fileHandle
                  .createWritable();


              await writable.write(
                blob
              );


              await writable.close();
            }


            alert(
              `${selected.length} file${selected.length === 1 ? "" : "s"} saved to "${exportFolderName}".`
            );


          } catch (error) {

            if (
              error.name !==
              "AbortError"
            ) {

              console.error(
                "Folder export failed:",
                error
              );


              alert(
                "The files could not be saved to that folder."
              );
            }


          } finally {

            saveButton.disabled =
              false;


            saveButton.textContent =
              originalText;
          }
        }
      );


      updateCount();
    }


    /*
      OPEN ENQUIRY

      This is exposed on window so
      the enquiry cards can call it.
    */

    window.openEnquiry =
      async function(id) {

        const enquiry =
          allEnquiries.find(
            item =>
              String(item.id) ===
              String(id)
          );


        if (!enquiry) {
          return;
        }


        currentEnquiry =
          enquiry;


        currentQuote =
          null;


        currentQuoteItems =
          [];


        currentNotes =
          [];


        currentBooking =
          null;


        modalTitle.textContent =
          enquiry.name ||
          "Customer Enquiry";


        modalReference.textContent =
          enquiry.enquiry_ref ||
          "";


        modalBody.innerHTML = `
          <div class="loading">
            Loading enquiry workflow...
          </div>
        `;


        modalBackdrop.style.display =
          "flex";


        await loadEnquiryWorkflow(
          enquiry.id
        );


        renderModalContent();


        await renderUploadSections();
      };


    function hideModal() {

      modalBackdrop.style.display =
        "none";


      currentEnquiry =
        null;


      currentQuote =
        null;


      currentQuoteItems =
        [];


      currentNotes =
        [];


      currentBooking =
        null;
    }


    /*
      LOGIN
    */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        clearMessage();


        loginButton.disabled =
          true;


        loginButton.textContent =
          "Signing in...";


        const email =
          document.getElementById(
            "email"
          )
            .value
            .trim();


        const password =
          document.getElementById(
            "password"
          ).value;


        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {

          showMessage(
            "Login failed. Check your email and password.",
            "error"
          );


          loginButton.disabled =
            false;


          loginButton.textContent =
            "Sign In";


          return;
        }


        await verifyAdmin(
          data.user
        );


        loginButton.disabled =
          false;


        loginButton.textContent =
          "Sign In";
      }
    );


    /*
      LOGOUT
    */

    logoutButton.addEventListener(
      "click",
      async () => {

        await supabaseClient
          .auth
          .signOut();


        currentUserId =
          null;


        document.getElementById(
          "password"
        ).value =
          "";


        showLogin();

        clearMessage();
      }
    );


    refreshButton.addEventListener(
      "click",
      loadEnquiries
    );


    searchInput.addEventListener(
      "input",
      filterEnquiries
    );


    statusFilter.addEventListener(
      "change",
      filterEnquiries
    );


    closeModal.addEventListener(
      "click",
      hideModal
    );


    modalBackdrop.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modalBackdrop
        ) {

          hideModal();
        }
      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          hideModal();
        }
      }
    );


    /*
      INITIALISE
    */

    async function initialiseAdminPortal() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient
          .auth
          .getSession();


      if (
        session?.user
      ) {

        await verifyAdmin(
          session.user
        );

      } else {

        showLogin();
      }
    }


    initialiseAdminPortal();

  </script>

</body>
