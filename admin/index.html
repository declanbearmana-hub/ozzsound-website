<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozzsound Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #07070c;
      --panel: #101018;
      --panel2: #15151f;
      --border: rgba(255,255,255,0.09);
      --text: #ffffff;
      --muted: #9292a3;
      --purple: #a855f7;
      --pink: #ff38d1;
      --cyan: #22d3ee;
      --green: #35e6a5;
      --orange: #ffb454;
      --red: #ff647c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(174,0,255,0.15), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(0,225,255,0.10), transparent 32%),
        var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* LOGIN */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      padding: 42px;
      border-radius: 24px;
      background: rgba(14,14,24,0.96);
      border: 1px solid var(--border);
      box-shadow:
        0 0 40px rgba(174,0,255,0.16),
        0 25px 80px rgba(0,0,0,0.45);
    }

    .brand-title {
      margin: 0;
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      margin: 9px 0 30px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #d7d7df;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid #30303e;
      outline: none;
      background: #0a0a12;
      color: #fff;
    }

    input:focus,
    select:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
    }

    .primary-button {
      width: 100%;
      margin-top: 24px;
      padding: 15px 18px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(90deg, #d629d7, #8b4dff, #00bfe8);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 10px;
      font-size: 14px;
    }

    .message.error {
      display: block;
      color: #ff9aaa;
      background: rgba(255,70,100,0.10);
      border: 1px solid rgba(255,70,100,0.35);
    }

    /* ADMIN */

    #adminArea {
      display: none;
      min-height: 100vh;
    }

    .admin-header {
      min-height: 78px;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,7,12,0.92);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
    }

    .admin-logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .admin-email {
      color: var(--muted);
      font-size: 13px;
    }

    .logout-button {
      padding: 10px 17px;
      border-radius: 10px;
      border: 1px solid #343442;
      color: #fff;
      background: #1c1c27;
      cursor: pointer;
      font-weight: 700;
    }

    .admin-content {
      width: 100%;
      max-width: 1500px;
      margin: auto;
      padding: 42px 30px 70px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 38px;
    }

    .page-heading p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .refresh-button {
      padding: 11px 17px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: #fff;
      background: var(--panel2);
      cursor: pointer;
      font-weight: 700;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 22px;
      border-radius: 17px;
      background: rgba(16,16,24,0.94);
      border: 1px solid var(--border);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-number {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 900;
    }

    /* TOOLBAR */

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 14px;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    /* ENQUIRIES */

    .enquiry-list {
      display: grid;
      gap: 13px;
    }

    .enquiry-card {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr 150px;
      align-items: center;
      gap: 20px;
      padding: 20px 22px;
      border-radius: 16px;
      background: rgba(16,16,24,0.95);
      border: 1px solid var(--border);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .enquiry-card:hover {
      transform: translateY(-1px);
      border-color: rgba(168,85,247,0.45);
    }

    .client-name {
      font-size: 17px;
      font-weight: 800;
    }

    .reference {
      margin-top: 5px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 700;
    }

    .field-label {
      margin-bottom: 5px;
      color: #717181;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .field-value {
      color: #e5e5ed;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .status-new {
      color: #7debd0;
      background: rgba(53,230,165,0.12);
      border: 1px solid rgba(53,230,165,0.25);
    }

    .status-contacted {
      color: #7fdcff;
      background: rgba(34,211,238,0.12);
      border: 1px solid rgba(34,211,238,0.25);
    }

    .status-quoted {
      color: #d2a3ff;
      background: rgba(168,85,247,0.12);
      border: 1px solid rgba(168,85,247,0.25);
    }

    .status-booked {
      color: #ff9ee8;
      background: rgba(255,56,209,0.12);
      border: 1px solid rgba(255,56,209,0.25);
    }

    .status-completed {
      color: #b8b8c5;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .status-cancelled {
      color: #ff9aaa;
      background: rgba(255,100,124,0.10);
      border: 1px solid rgba(255,100,124,0.25);
    }

    .photos {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .open-button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid rgba(168,85,247,0.35);
      background: rgba(168,85,247,0.10);
      color: #d9b6ff;
      cursor: pointer;
      font-weight: 800;
    }

    .open-button:hover {
      background: rgba(168,85,247,0.18);
    }

    .loading,
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .error-state {
      padding: 22px;
      border-radius: 14px;
      color: #ff9aaa;
      background: rgba(255,70,100,0.08);
      border: 1px solid rgba(255,70,100,0.25);
    }

    /* MODAL */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 30px 20px;
      overflow-y: auto;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(8px);
    }

    .modal {
      width: 100%;
      max-width: 850px;
      margin: auto;
      border-radius: 22px;
      overflow: hidden;
      background: #101018;
      border: 1px solid var(--border);
      box-shadow: 0 30px 100px rgba(0,0,0,0.65);
    }

    .modal-header {
      padding: 24px 26px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-button {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1b1b26;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
    }

    .modal-body {
      padding: 26px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .detail-box {
      padding: 16px;
      border-radius: 12px;
      background: #0b0b12;
      border: 1px solid var(--border);
    }

    .detail-box.full {
      grid-column: 1 / -1;
    }

    .detail-title {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .detail-text {
      color: #eeeeF4;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 1050px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .enquiry-card {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .admin-header {
        padding: 15px 18px;
      }

      .admin-email {
        display: none;
      }

      .admin-content {
        padding: 30px 16px 60px;
      }

      .page-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .enquiry-card {
        grid-template-columns: 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-box.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginPage" class="login-page">

    <div class="login-card">

      <h1 class="brand-title">OZZSOUND</h1>
      <div class="brand-subtitle">Administration Portal</div>

      <form id="loginForm">

        <label for="email">Admin Email</label>
        <input
          id="email"
          type="email"
          value="ozzsound@hotmail.com"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" class="primary-button" type="submit">
          Sign In
        </button>

        <div id="message" class="message"></div>

      </form>

    </div>

  </div>


  <!-- ADMIN -->

  <div id="adminArea">

    <header class="admin-header">

      <div class="admin-logo">
        OZZSOUND ADMIN
      </div>

      <div class="header-right">

        <div id="adminEmail" class="admin-email"></div>

        <button id="logoutButton" class="logout-button">
          Sign Out
        </button>

      </div>

    </header>


    <main class="admin-content">

      <div class="page-heading">

        <div>
          <h1>Enquiries</h1>
          <p>Manage Ozzsound website enquiries and upcoming events.</p>
        </div>

        <button id="refreshButton" class="refresh-button">
          ↻ Refresh
        </button>

      </div>


      <section class="stats">

        <div class="stat-card">
          <div class="stat-label">Total Enquiries</div>
          <div id="totalCount" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">New</div>
          <div id="newCount" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Booked</div>
          <div id="bookedCount" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">With Photos</div>
          <div id="photoCount" class="stat-number">0</div>
        </div>

      </section>


      <section class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="Search customer, reference, venue or event..."
        >

        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="quoted">Quoted</option>
          <option value="booked">Booked</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>

      </section>


      <section id="enquiryList" class="enquiry-list">

        <div class="loading">
          Loading enquiries...
        </div>

      </section>

    </main>

  </div>


  <!-- ENQUIRY MODAL -->

  <div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

      <div class="modal-header">

        <div>
          <h2 id="modalTitle">Enquiry</h2>
          <div id="modalReference" class="reference"></div>
        </div>

        <button id="closeModal" class="close-button">
          ×
        </button>

      </div>

      <div id="modalBody" class="modal-body"></div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://lnritqkwejumknddyfzu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_-5JZTaagJ2ozQ6QPPyIbxA_kgp-L5jx";


    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


    let allEnquiries = [];


    const loginPage = document.getElementById("loginPage");
    const adminArea = document.getElementById("adminArea");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const message = document.getElementById("message");
    const adminEmail = document.getElementById("adminEmail");
    const enquiryList = document.getElementById("enquiryList");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const refreshButton = document.getElementById("refreshButton");

    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalTitle = document.getElementById("modalTitle");
    const modalReference = document.getElementById("modalReference");
    const modalBody = document.getElementById("modalBody");
    const closeModal = document.getElementById("closeModal");


    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function displayValue(value) {
      if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
      ) {
        return "Not supplied";
      }

      return escapeHtml(value);
    }


    function formatDate(value) {

      if (!value) return "Not supplied";

      const parts = String(value).split("-");

      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }

      return escapeHtml(value);
    }


    function normaliseStatus(value) {

      const allowed = [
        "new",
        "contacted",
        "quoted",
        "booked",
        "completed",
        "cancelled"
      ];

      const status = String(value || "new").toLowerCase();

      return allowed.includes(status) ? status : "new";
    }


    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }


    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }


    function showLogin() {
      adminArea.style.display = "none";
      loginPage.style.display = "flex";
    }


    function showAdmin(email) {
      loginPage.style.display = "none";
      adminArea.style.display = "block";
      adminEmail.textContent = email;
    }


    async function verifyAdmin(user) {

      if (!user) {
        showLogin();
        return false;
      }

      const { data, error } =
        await supabaseClient.rpc("is_admin");

      if (error || data !== true) {

        await supabaseClient.auth.signOut();

        showLogin();

        showMessage(
          "Access denied. This account is not an authorised Ozzsound administrator.",
          "error"
        );

        return false;
      }

      showAdmin(user.email);

      await loadEnquiries();

      return true;
    }


    async function loadEnquiries() {

      enquiryList.innerHTML =
        '<div class="loading">Loading enquiries...</div>';

      refreshButton.disabled = true;

      const { data, error } =
        await supabaseClient
          .from("enquiries")
          .select(`
            id,
            created_at,
            enquiry_ref,
            enquiry_type,
            name,
            phone,
            email,
            event_type,
            event_date,
            venue_suburb,
            approx_guests,
            event_times,
            message,
            upload_count,
            attachment_paths,
            display_photo_paths,
            upload_paths,
            status
          `)
          .order("created_at", { ascending: false });

      refreshButton.disabled = false;

      if (error) {

        console.error(error);

        enquiryList.innerHTML =
          '<div class="error-state">Could not load enquiries. Please refresh and try again.</div>';

        return;
      }

      allEnquiries = data || [];

      updateStats();

      filterEnquiries();
    }


    function updateStats() {

      const total = allEnquiries.length;

      const newTotal =
        allEnquiries.filter(
          enquiry => normaliseStatus(enquiry.status) === "new"
        ).length;

      const bookedTotal =
        allEnquiries.filter(
          enquiry => normaliseStatus(enquiry.status) === "booked"
        ).length;

      const withPhotos =
        allEnquiries.filter(
          enquiry => Number(enquiry.upload_count || 0) > 0
        ).length;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("newCount").textContent = newTotal;
      document.getElementById("bookedCount").textContent = bookedTotal;
      document.getElementById("photoCount").textContent = withPhotos;
    }


    function filterEnquiries() {

      const search =
        searchInput.value.trim().toLowerCase();

      const selectedStatus =
        statusFilter.value;

      const filtered =
        allEnquiries.filter(enquiry => {

          const status =
            normaliseStatus(enquiry.status);

          const searchableText = [
            enquiry.name,
            enquiry.enquiry_ref,
            enquiry.event_type,
            enquiry.enquiry_type,
            enquiry.venue_suburb,
            enquiry.email,
            enquiry.phone
          ]
            .join(" ")
            .toLowerCase();

          const matchesSearch =
            !search || searchableText.includes(search);

          const matchesStatus =
            selectedStatus === "all" ||
            status === selectedStatus;

          return matchesSearch && matchesStatus;
        });

      renderEnquiries(filtered);
    }


    function renderEnquiries(enquiries) {

      if (!enquiries.length) {

        enquiryList.innerHTML =
          '<div class="empty-state">No enquiries match your current search or filter.</div>';

        return;
      }

      enquiryList.innerHTML =
        enquiries.map(enquiry => {

          const status =
            normaliseStatus(enquiry.status);

          const eventType =
            enquiry.event_type ||
            enquiry.enquiry_type ||
            "Not supplied";

          const photos =
            Number(enquiry.upload_count || 0);

          return `
            <article class="enquiry-card">

              <div>
                <div class="client-name">
                  ${displayValue(enquiry.name)}
                </div>

                <div class="reference">
                  ${displayValue(enquiry.enquiry_ref)}
                </div>

                <div class="photos">
                  ${photos} uploaded file${photos === 1 ? "" : "s"}
                </div>
              </div>

              <div>
                <div class="field-label">Event</div>
                <div class="field-value">
                  ${displayValue(eventType)}
                </div>
              </div>

              <div>
                <div class="field-label">Event Date</div>
                <div class="field-value">
                  ${formatDate(enquiry.event_date)}
                </div>
              </div>

              <div>
                <div class="field-label">Venue / Suburb</div>
                <div class="field-value">
                  ${displayValue(enquiry.venue_suburb)}
                </div>

                <div style="margin-top:9px;">
                  <span class="status status-${status}">
                    ${escapeHtml(status)}
                  </span>
                </div>
              </div>

              <div>
                <button
                  class="open-button"
                  onclick="openEnquiry('${escapeHtml(enquiry.id)}')"
                >
                  Open Enquiry
                </button>
              </div>

            </article>
          `;
        })
        .join("");
    }

async function openEnquiry(id) {

  const enquiry =
    allEnquiries.find(item => String(item.id) === String(id));

  if (!enquiry) return;

  const eventType =
    enquiry.event_type ||
    enquiry.enquiry_type ||
    "Not supplied";

  modalTitle.textContent =
    enquiry.name || "Customer Enquiry";

  modalReference.textContent =
    enquiry.enquiry_ref || "";

  modalBody.innerHTML = `
    <div class="detail-grid">

      <div class="detail-box">
        <div class="detail-title">Event Type</div>
        <div class="detail-text">
          ${displayValue(eventType)}
        </div>
      </div>

      <div class="detail-box">
        <div class="detail-title">Event Date</div>

  function pathArray(value) {

    if (!value) return [];

    if (Array.isArray(value)) {
      return value.filter(item => typeof item === "string");
    }

    if (typeof value === "string") {

      try {
        const parsed = JSON.parse(value);

        if (Array.isArray(parsed)) {
          return parsed.filter(item => typeof item === "string");
        }
      } catch (_) {}

      return [value];
    }

    return [];
  }

      }));

  function safeFileName(name) {
    return String(name || "Ozzsound-file")
      .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
      .replace(/[. ]+$/g, "")
      .slice(0, 180) || "Ozzsound-file";
  }


  function updateSelectedUploadCount() {

    const boxes = getUploadCheckboxes();

    const selected =
      boxes.filter(box => box.checked);

    selectedUploadCount.textContent =
      `${selected.length} selected`;

    selectAllUploads.checked =
      boxes.length > 0 &&
      selected.length === boxes.length;

    selectAllUploads.indeterminate =
      selected.length > 0 &&
      selected.length < boxes.length;
  }


  selectAllUploads.addEventListener(
    "change",
    () => {

      getUploadCheckboxes().forEach(box => {
        box.checked = selectAllUploads.checked;

      const originalText =

      try {

          const response =
            await fetch(item.url);

          if (!response.ok) {
            throw new Error(
              `Could not download ${item.name}`
            );
          }

          const blob =
            await response.blob();

          const blobUrl =
            URL.createObjectURL(blob);

          const link =
            document.createElement("a");

          link.href = blobUrl;
          link.download =
            safeFileName(item.name);

          document.body.appendChild(link);

          link.click();
          link.remove();

          setTimeout(
            () => URL.revokeObjectURL(blobUrl),

          await new Promise(resolve =>
