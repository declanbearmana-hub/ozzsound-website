<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ozzsound">
  <defs>
    <linearGradient id="ozz" x1="70" y1="70" x2="442" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff2bd6"/>
      <stop offset=".5" stop-color="#9b4dff"/>
      <stop offset="1" stop-color="#27e6ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="#08090f"/>
  <rect x="22" y="22" width="468" height="468" rx="100" fill="none" stroke="url(#ozz)" stroke-width="18"/>
  <g fill="url(#ozz)" opacity=".95" filter="url(#glow)">
    <rect x="132" y="92" width="18" height="72" rx="9"/>
    <rect x="166" y="68" width="18" height="96" rx="9"/>
    <rect x="200" y="42" width="18" height="122" rx="9"/>
    <rect x="234" y="76" width="18" height="88" rx="9"/>
    <rect x="268" y="54" width="18" height="110" rx="9"/>
    <rect x="302" y="82" width="18" height="82" rx="9"/>
    <rect x="336" y="104" width="18" height="60" rx="9"/>
  </g>
  <text x="256" y="330" text-anchor="middle" fill="url(#ozz)" font-family="Arial Black,Arial,sans-serif" font-size="176" font-style="italic" font-weight="900" letter-spacing="-18">OZ</text>
  <path d="M116 370H396" stroke="url(#ozz)" stroke-width="8" stroke-linecap="round"/>
  <text x="256" y="420" text-anchor="middle" fill="#f3f4fb" font-family="Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="13">SOUND</text>
</svg>
