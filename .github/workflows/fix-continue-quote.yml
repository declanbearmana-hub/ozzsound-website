name: Verify Continue Quote button

on:
  push:
    paths:
      - 'admin/index.html'
      - '.github/workflows/fix-continue-quote.yml'
  pull_request:
    paths:
      - 'admin/index.html'
      - '.github/workflows/fix-continue-quote.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Continue Quote controls
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('admin/index.html').read_text(encoding='utf-8')
          required = ['startReview', 'saveQuoteButton', 'scrollIntoView']
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit('Missing Continue Quote controls: ' + ', '.join(missing))
          print('Continue Quote controls present')
          PY
